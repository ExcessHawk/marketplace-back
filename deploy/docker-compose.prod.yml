# Marketplace demo stack for the VPS.
#
# Nothing here publishes a port to the internet. Postgres and Redis bind to
# 127.0.0.1 only (handy for psql over SSH), and the API answers on 127.0.0.1
# so nginx is the single front door.
#
# Se corre desde la raíz de este repo:
#   docker compose --env-file .env -f deploy/docker-compose.prod.yml up -d

name: marketplace-demo

services:
  postgres:
    image: postgres:17-alpine
    container_name: marketplace_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:-marketplace}
    ports:
      - '127.0.0.1:5442:5432'
    volumes:
      - marketplace_pgdata:/var/lib/postgresql/data
      - ../docker/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-marketplace}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: marketplace_redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6442:6379'
    command: ['redis-server', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: marketplace-api:latest
    container_name: marketplace_api
    restart: unless-stopped
    env_file:
      - ../api.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marketplace}
      REDIS_URL: redis://redis:6379
    ports:
      - '127.0.0.1:3102:3102'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'bun', '-e', "fetch('http://127.0.0.1:3102/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

volumes:
  marketplace_pgdata:
