# api.veloce-ts.com — la misma API, expuesta aparte para que la consola del
# portafolio pueda enseñar peticiones contra un dominio con nombre propio.
#
# El registro A ya existía apuntando a este VPS; solo le faltaba alguien que
# contestara.

server {
    listen 80;
    listen [::]:80;
    server_name api.veloce-ts.com;

    access_log /var/log/nginx/api.access.log;
    error_log  /var/log/nginx/api.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 2m;

    # Nada de SPA aquí: si no es /api, /health o /ws, no existe.
    location = / {
        return 302 https://demo.alfredomejia.com.mx/;
    }

    location /api/ {
        proxy_pass http://marketplace_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    location /health/ {
        proxy_pass http://marketplace_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    location /ws/ {
        proxy_pass http://marketplace_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        return 404;
    }
}
